<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weathe App</title>
    <!-- Normalize Link -->
     <link rel="stylesheet" href="css/normalize.css">
     <!-- Main Styles Links -->
      <link rel="stylesheet" href="css/main.css">
  </head>
  <body>
    <main>
      <div class="box">
        <div class="upper">
          <input type="text" name="" id="" placeholder="Enter City Name" />
          <div class="searchbtn">
            <img src="images/search.png" alt="Search-Pic" />
          </div>
        </div>
        <div class="main">
          <div class="state-img">
            <img src="images/clear.png" alt="Image" />
          </div>
          <h2>7°C</h2>
          <h3>Tripoli</h3>
        </div>
        <div class="lower">
          <div class="box">
            <div class="img-box">
              <img src="images/humidity.png" alt="" />
            </div>
            <p>48%</p>
            <p>Humidity</p>
          </div>
          <div class="box">
            <div class="img-box">
              <img src="images/wind.png" alt="" />
            </div>
            <p>10.29 km/h</p>
            <p>Wind Speed</p>
          </div>
        </div>
      </div>
    </main>
    <script src="main.js"></script>
  </body>
</html>
